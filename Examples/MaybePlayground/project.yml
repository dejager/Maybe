name: MaybePlayground
options:
  bundleIdPrefix: dev.maybe
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGNING_ALLOWED: NO
packages:
  Maybe:
    path: ../..
targets:
  MaybePlayground:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: Maybe
        product: Maybe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.maybe.playground
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Maybe
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
  MaybePlaygroundUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: MaybePlayground
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.maybe.playground.uitests
schemes:
  MaybePlayground:
    build:
      targets:
        MaybePlayground: all
        MaybePlaygroundUITests: [test]
    test:
      targets: [MaybePlaygroundUITests]
